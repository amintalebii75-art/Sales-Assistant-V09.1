<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5c37b4"><title>اتصال برقرار نیست</title><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f8fc;color:#211649;margin:0;display:grid;place-items:center;min-height:100vh;padding:24px}.card{max-width:440px;background:#fff;border:1px solid #e8e4f4;border-radius:24px;padding:28px;text-align:center;box-shadow:0 18px 48px rgba(34,22,73,.1)}.mark{width:64px;height:64px;border-radius:20px;background:#5c37b4;color:#fff;display:grid;place-items:center;margin:0 auto 18px;font-size:28px}h1{font-size:22px}p{line-height:1.9;color:#665d7b}button{border:0;border-radius:12px;background:#5c37b4;color:#fff;padding:12px 18px;font:inherit;cursor:pointer}</style></head><body><main class="card"><div class="mark">!</div><h1>اینترنت یا سرور در دسترس نیست</h1><p>برای حفاظت از اطلاعات مشتری، نسخه آفلاین داده‌های حساب نمایش داده نمی‌شود. اتصال را بررسی کن و دوباره تلاش کن.</p><button onclick="location.reload()">تلاش دوباره</button></main></body></html>
